{{if .IsLoggedIn}}
<div class="welcome-logged-in">
    <div class="action-title">
        <h2>Choose the action</h2>
        <p>Select action you want to perform</p>
    </div>
    <ul hx-target="#main-content" class="nav">
        <li hx-get="/upload" hx-push-url="true" class="nav-pill">
            <div hx-trigger="load" hx-push-url="false" hx-target="this" hx-get="/static/assets/upload.svg"
                hx-swap="outerHTML"></div>
            Upload
        </li>
        <li hx-get="/search/?redirect=true" hx-push-url="true" class="nav-pill">
            <div hx-trigger="load" hx-push-url="false" hx-target="this" hx-get="/static/assets/search.svg"
                hx-swap="outerHTML"></div>
            Find
        </li>
        <li hx-get="/settings" hx-push-url="true" class="nav-pill">
            <div hx-trigger="load" hx-push-url="false" hx-target="this" hx-get="/static/assets/settings.svg"
                hx-swap="outerHTML"></div>
            Settings
        </li>
    </ul>
</div>
{{else}}
<div id="welcome-container">
    <h2>Welcome to the Storage</h2>
    <button class="button" hx-target="#main-content" hx-get="/login" hx-swap="innerHTML"
        hx-push-url="true">Login?</button>
</div>
{{end}}
