{{if .IsLoggedIn}}
<div class="welcome-logged-in">
    <div class="action-title">
        <h2>Choose the action</h2>
        <p>Select action you want to perform</p>
    </div>
    <ul hx-push-url="true" class="nav">
        <li hx-get="/upload" class="nav-pill"><img src="/static/assets/upload.svg" alt="upload">Upload</li>
        <li hx-get="/find" class="nav-pill"><img src="/static/assets/search.svg" alt="search">Find</li>
        <li hx-get="/settings" class="nav-pill"><img src="/static/assets/settings.svg" alt="settings">Settings
        </li>
    </ul>
</div>
{{else}}
<div id="welcome-container">
    <h2>Welcome to the Storage</h2>
    <button class="button" hx-target="#main-content" hx-get="/login" hx-swap="innerHTML"
        hx-push-url="true">Login?</button>
</div>
{{end}}
