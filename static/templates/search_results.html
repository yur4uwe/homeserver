<div id="search-results">
    <table class="search-table">
        <thead>
            {{if .Directory}}
            <tr>
                <th class="directory-header">
                    <div hx-get="/search/{{.Parent}}?query={{.URIQuery}}">
                        <icon name="arrow-left"></icon>
                    </div>
                </th>
                <th colspan="3">{{.Directory}}</th>
            </tr>
            {{end}}
            <tr class="search-header">
                <th>Type</th>
                <th>Name</th>
                <th>Size</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {{range .Entries}}
            <tr class="search-result {{if .IsFolder}} search-folder {{else}} search-file {{end}}" {{if .IsFolder}}
                hx-get="/search/{{.URIPath}}{{.URIName}}?query={{$.URIQuery}}" data-folder-path="{{.Path}}/{{.Name}}"
                {{end}}>
                <td class="file-type">
                    <div class="{{if .IsFolder}}folder-icon{{else}}file-icon{{end}}">
                        <icon name="{{.Type}}"></icon>
                    </div>
                </td>
                <td class="file-name">{{.Name}}</td>
                <td class="file-size">{{.Size}}</td>
                <td class="file-actions">
                    <div class="folder-icon">
                        <icon name="more"></icon>
                    </div>
                </td>
            </tr>
            {{end}}
            {{if not .Entries}}
            {{if .Query}}
            <tr>
                <td class="no-results">
                    <p>No results found for "{{.Query}}".</p>
                </td>
            </tr>
            {{else}}
            <tr class="empty-results">
                <td colspan="3" class="empty">
                    <div style="width: 110px; height: 95px;">
                        <icon name="folder-open"></icon>
                    </div>
                    <p class="no-files">No files found</p>
                </td>
            </tr>
            {{end}}
            {{end}}
        </tbody>
    </table>
</div>
