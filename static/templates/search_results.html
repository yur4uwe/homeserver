<div id="search-results">
    <table class="search-table" hx-push-url="true">
        <thead>
            {{if .Directory}}
            <tr>
                <th class="directory-header">
                    <div hx-get="/search/{{.Parent}}">
                        <icon name="arrow-left"></icon>
                    </div>
                </th>
                <th colspan="{{if .QueryResults}}4{{else}}3{{end}}">
                    {{.Directory}}
                </th>
            </tr>
            {{end}}
            <tr class="search-header">
                <th>Type</th>
                <th>Name</th>
                {{if .QueryResults}}
                <th>Path</th>
                {{end}}
                <th>Size</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {{range .Entries}}
            <tr class="search-result {{if .IsFolder}} search-folder {{else}} search-file {{end}}" draggable="false" {{if
                .IsFolder}} hx-get="/search/{{.URIPath}}{{.URIName}}" hx-trigger="dblclick" {{end}}
                data-path="{{.Path}}" data-name="{{.Name}}">
                <td class="file-type">
                    <div class="{{if .IsFolder}}folder-icon{{else}}file-icon{{end}}">
                        <icon name="{{.Type}}"></icon>
                    </div>
                </td>
                <td class="file-name">{{.Name}}</td>
                {{if .QueryResults}}
                <td class="file-path">{{.Path}}</td>
                {{end}}
                <td class="file-size">{{.Size}}</td>
                <td class="file-actions">
                    <div class="folder-icon">
                        <icon name="more"></icon>
                    </div>
                </td>
            </tr>
            {{end}}
            {{if not .Entries}}
            {{if .Query}}
            <tr>
                <td class="no-results">
                    <p>No results found for "{{.Query}}".</p>
                </td>
            </tr>
            {{else}}
            <tr class="empty-results">
                <td colspan="3" class="empty">
                    <div style="width: 110px; height: 95px;">
                        <icon name="folder-open"></icon>
                    </div>
                    <p class="no-files">No files found</p>
                </td>
            </tr>
            {{end}}
            {{end}}
        </tbody>
    </table>
</div>
