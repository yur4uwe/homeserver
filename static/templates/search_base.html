<div class="search-container" hx-target="#search-results" hx-swap="outerHTML">
    <form id="search-form" hx-get="" hx-trigger="keyup changed delay:500ms">
        <h2>Find the file you want</h2>
        <fieldset>
            <legend>Search</legend>
            <div class="search-input-container">
                <div style="width: 25px; height: 25px;">
                    <div hx-trigger="load" hx-target="this" hx-get="/static/assets/search.svg" hx-swap="outerHTML">
                    </div>
                </div>
                <input type="text" name="query" id="search-input" placeholder="Search files..." value="{{.Query}}">
                <button type="reset" hx-get="">
                    <div hx-trigger="load" hx-target="this" hx-get="/static/assets/x.svg" hx-swap="innerHTML">
                    </div>
                </button>
            </div>
        </fieldset>
    </form>
    {{template "search_results.html" .}}
    <script src="/static/scripts/file_search_hook.js"></script>
</div>
