<div class="alert alert-{{.Type}}" hx-get="/nothing" hx-trigger="load delay:5s"
    hx-on::before-request="this.classList.add('removing')">
    <div class="alert-header">
        <div style="width: 40px; height: 30px;">
            {{.Icon}}
        </div>
        <h4>{{.Title}}</h4>
    </div>
    <p>{{.Message}}</p>
</div>
