<div class="search-container">
    <div class="header-container">
        <h2>Find the file you want</h2>
        <fieldset>
            <legend>Search</legend>
            <div class="search-input-container">
                <div style="width: 25px; height: 25px;">
                    <icon name="search"></icon>
                </div>
                <input type="text" name="search" id="search-input" placeholder="Search files..." value="{{.Query}}"
                    hx-get="/api/v1/search" hx-target="#search-results" hx-trigger="keyup changed delay:500ms">
            </div>
        </fieldset>
    </div>
    <div id="search-results">
        {{range .Entries}}
        <div class="search-result {{if .IsFolder}} search-folder{{else}} search-file{{end}}" {{if .IsFolder}}
            hx-get="/api/v1/search?directory={{.Path}}" hx-target="#search-results" hx-select="#search-results"
            hx-push-url="true" hx-swap="innerHTML" {{else}} {{end}}>
            <span class="file-name">{{.Name}}</span>
            <span class="file-path">{{.Path}}</span>
            {{if .IsFolder}}
            <span class="file-type">Folder</span>
            {{else}}
            <span class="file-type">File</span>
            {{end}}
        </div>
        {{end}}
        {{if not .Entries}}
        {{if .Query}}
        <div class="no-results">
            <p>No results found for "{{.Query}}".</p>
        </div>
        {{else}}
        <div class="empty">
            <div style="width: 110px; height: 95px;">
                <icon name="folder-open"></icon>
            </div>
            <p class="no-files">No files found</p>
        </div>
        {{end}}
        {{end}}
    </div>
</div>
