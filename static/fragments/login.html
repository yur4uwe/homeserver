<div class="login-container">
    <h2>Login</h2>
    <form class="login-form" hx-post="/api/v1/login" hx-target="#main-content" hx-target-error="#error-resp">
        <a class="back-arrow" hx-get="/" hx-target="#main-content" hx-push-url="true">
            <img src="/static/assets/arrow-left.svg" alt="back" style="width: 20px; height: 20px;">
            <p>
                Back To Welcome
            </p>
        </a>

        <div id="identificator-wrapper">
            <fieldset>
                <legend>Username or Email</legend>
                <input type="text" name="identificator" placeholder="Your Username or Email">
            </fieldset>
        </div>
        <div id="password-wrapper">
            <fieldset>
                <legend>Password</legend>
                <input type="password" name="password" placeholder="Your Password">
            </fieldset>
        </div>

        <div id="error-resp"></div>

        <a class="link" hx-get="/register" hx-target="#main-content" hx-push-url="true">Register</a>
        <button class="button" type="submit">Login</button>
    </form>
</div>
