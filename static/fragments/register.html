<div class="register-container">
    <h2>Register</h2>
    <form class="register-form" hx-post="/api/v1/register" hx-target="#main-content" hx-target-error="#error-resp">
        <a class="back-arrow" hx-get="/" hx-target="#main-content" hx-push-url="true">
            <div class="back-arrow-icon" style="width: 20px; height: 20px;">
                <icon name="arrow-left"></icon>
            </div>
            <p>Back To Welcome</p>
        </a>

        <div id="username-wrapper">
            <fieldset>
                <legend>Username</legend>
                <input type="text" name="username" placeholder="Your Username">
            </fieldset>
        </div>

        <div id="email-wrapper">
            <fieldset>
                <legend>Email</legend>
                <input type="email" name="email" placeholder="Your Email">
            </fieldset>
        </div>

        <div id="password-wrapper">
            <fieldset>
                <legend>Password</legend>
                <input type="password" name="password" placeholder="Your Password">
            </fieldset>
        </div>

        <div id="confirm-password-wrapper">
            <fieldset>
                <legend>Confirm Password</legend>
                <input type="password" name="confirm-password" placeholder="Confirm Password">
            </fieldset>
        </div>

        <div id="error-resp"></div>

        <a class="link" hx-get="/login" hx-target="#main-content" hx-push-url="true">Login</a>
        <button class="button register-button" type="submit">Register</button>
    </form>
</div>
