<div class="upload-content-wrapper">
    <div class="upload-wrapper">
        <h1>Upload File</h1>
        <form id="upload-form" action="/api/v1/upload" method="post" hx-encoding="multipart/form-data"
            hx-post="/api/v1/upload">
            <div class="form-header">
                Choose a file to upload
                <div class="upload-actions">
                    <label for="upload-type-menu">
                        <div style="width: 25px; height: 25px;">
                            <icon name="upload"></icon>
                        </div>
                        <!-- <svg width="25" height="25" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">

                                stroke="#565656" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg> -->
                    </label>
                    <input type="checkbox" id="upload-type-menu" hidden checked>
                    <div id="upload-actions">
                        <label for="file">
                            <icon name="file"></icon>
                            Upload Files
                        </label>
                        <input type="file" id="file" hx-encoding="multipart/form-data" name="file" required hidden
                            hx-trigger="change" hx-post="/api/v1/upload" multiple>
                        <label for="folder">
                            <icon name="folder"></icon>
                            Upload Folder
                        </label>
                        <input type="file" id="folder" hx-encoding="multipart/form-data" name="folder" required hidden
                            webkitdirectory mozdirectory>
                    </div>
                </div>
            </div>
            <div id="form-body">
                <div class="empty">
                    <div style="width: 110px; height: 95px;">
                        <icon name="folder-open"></icon>
                    </div>
