<div class="upload-content-wrapper">
    <div class="upload-wrapper">
        <h1>Upload File</h1>
        <form id="upload-form" action="/api/v1/upload" method="post" hx-encoding="multipart/form-data">
            <div class="form-header">
                Choose a file to upload
                <div class="upload-actions">
                    <label for="upload-type-menu">
                        <div style="width: 25px; height: 25px;" hx-trigger="load" hx-get="/static/assets/upload.svg"
                            hx-swap="innerHTML">
                        </div>
                        <input type="checkbox" id="upload-type-menu" hidden checked>
                        <div id="upload-actions">
                            <label for="file">
                                <div hx-get="/static/assets/file.svg" hx-trigger="load" hx-swap="outerHTML"></div>
                                Upload Files
                            </label>
                            <input type="file" id="file" hx-encoding="multipart/form-data" name="file" required hidden
                                multiple>
                            <label for="folder">
                                <div hx-get="/static/assets/folder.svg" hx-trigger="load" hx-swap="outerHTML"></div>
                                Upload Folder
                            </label>
                            <input type="file" id="folder" hx-encoding="multipart/form-data" name="folder" required
                                hidden webkitdirectory mozdirectory>
                        </div>
                    </label>
                </div>
            </div>
            <div id="form-body">
                <div class="empty">
                    <div style="width: 110px; height: 95px;">
                        <div hx-trigger="load" hx-get="/static/assets/folder-open.svg" hx-swap="outerHTML"></div>
                    </div>
                    <p class="no-files">No file chosen</p>
                </div>
            </div>
        </form>
    </div>
    <script src="/static/scripts/file_upload_hook.js"></script>
</div>
